<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register yourself here</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>VulnLab</h1>
        <p class="subtitle">// security research & education platform</p>
    
        <h2>Register</h2>
    
        <p class="error" id="error-msg" style="display:none;"></p>
    
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="choose username" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="choose password" required />
            </div>
            <button type="submit">[ REGISTER ]</button>
        </form>
    
        <hr class="divider" />
        <p class="small-text">
            Already have an account? <a href="/login.html">Login here</a>
        </p>
    
        <div class="footer">!! For educational purposes only</div>
    </div>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (data.success) {
                window.location.href = '/login.html';
            } else {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = '! ' + data.error;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
